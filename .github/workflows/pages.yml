name: Deploy personal website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'public-site/**'
      - 'personal-ocean/src/**'
      - 'ascii-sharks/src/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: public-site
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: public-site/package-lock.json

      - name: Check public configuration
        run: |
          node --input-type=module <<'JS'
          for (const name of ['VITE_SUPABASE_URL', 'VITE_SUPABASE_PUBLISHABLE_KEY']) {
            if (!process.env[name]?.trim()) throw new Error(`Missing repository variable: ${name}`);
          }
          const url = new URL(process.env.VITE_SUPABASE_URL);
          if (url.protocol !== 'https:') throw new Error('The public Supabase URL must use HTTPS.');
          const key = process.env.VITE_SUPABASE_PUBLISHABLE_KEY.trim();
          if (!key.startsWith('sb_publishable_')) {
            let role;
            try { role = JSON.parse(Buffer.from(key.split('.')[1], 'base64url').toString()).role; } catch {}
            if (role !== 'anon') throw new Error('Use a publishable key or legacy anon key; server keys must stay in Supabase.');
          }
          JS

      - name: Install locked dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: public-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
